
name: DevOps CI/CD

on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:

  # ==========================================
  # JOB 1: TESTS DEL FRONTEND
  # ==========================================
  frontend-tests:
    name: Frontend Tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Descargar código
        uses: actions/checkout@v6

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Ejecutar tests
        run: npm run test:run

  # ==========================================
  # JOB 2: CONSTRUIR IMÁGENES DOCKER
  # ==========================================
  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código
        uses: actions/checkout@v6

      - name: Construir backend
        run: docker build -t todo-backend:ci ./backend

      - name: Construir frontend
        run: docker build -t todo-frontend:ci ./frontend

  # ==========================================
  # JOB 3: PUBLICAR IMÁGENES EN GHCR
  # ==========================================
  publish:
    name: Publish Docker Images
    runs-on: ubuntu-latest

    # Solo publicar si los trabajos anteriores pasan
    needs:
      - frontend-tests
      - docker-build

    # Solo publicar cuando se actualice main
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: read
      packages: write

    steps:
      - name: Descargar código
        uses: actions/checkout@v6

      - name: Normalizar usuario de GitHub
        run: echo "OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login en GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construir y publicar backend
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          push: true
          tags: |
            ghcr.io/${{ env.OWNER }}/fastapi-react-backend:latest
            ghcr.io/${{ env.OWNER }}/fastapi-react-backend:sha-${{ github.sha }}

      - name: Construir y publicar frontend
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          push: true
          tags: |
            ghcr.io/${{ env.OWNER }}/fastapi-react-frontend:latest
            ghcr.io/${{ env.OWNER }}/fastapi-react-frontend:sha-${{ github.sha }}
